name: SonarQube Scan - Backend

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  sonarqube:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run SonarQube analysis
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "C:\Users\stijn\Downloads\sonar-scanner-cli-4.8.0.2856\sonar-scanner-4.8.0.2856\bin\sonar-scanner.bat" ^
            -Dsonar.projectKey=dailyquestionsbackend ^
            -Dsonar.projectName="DailyQuestions Backend" ^
            -Dsonar.sources=. ^
            -Dsonar.exclusions=node_modules/**,coverage/**,**/*.test.js,**/*.spec.js ^
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info ^
            -Dsonar.host.url=http://localhost:9000 ^
            -Dsonar.login=%SONAR_TOKEN%
