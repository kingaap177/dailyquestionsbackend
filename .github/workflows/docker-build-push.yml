name: Build and load backend Docker image locally

on:
  push:
    branches: [main, dev, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t dailyquestionsbackend:latest .

      - name: Verify local Docker image
        run: |
          docker images dailyquestionsbackend:latest

